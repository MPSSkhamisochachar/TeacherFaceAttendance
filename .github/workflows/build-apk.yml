name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Unzip project (if uploaded as zip)
        run: |
          ZIPFILE=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -n "$ZIPFILE" ]; then
            echo "Found zip: $ZIPFILE"
            unzip -o "$ZIPFILE" -d extracted
            echo "EXTRACTED_DIR=extracted/$(ls extracted)" >> $GITHUB_ENV
          fi
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Add sdkmanager to PATH
        run: echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK (from extracted zip)
        if: env.EXTRACTED_DIR != ''
        working-directory: ${{ env.EXTRACTED_DIR }}
        run: gradle assembleDebug --no-daemon
      - name: Build debug APK (direct files)
        if: env.EXTRACTED_DIR == ''
        run: gradle assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Teacher-Face-Attendance-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            extracted/*/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
